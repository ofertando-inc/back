services:
  back-ofertando:
    build:
      context: .
      target: development
    container_name: back-ofertando-app
    init: true
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REPORT_THRESHOLD: ${REPORT_THRESHOLD:-10}
      COMMENT_REPORT_THRESHOLD: ${COMMENT_REPORT_THRESHOLD:-5}
      OFFER_EXPIRATION_ENABLED: ${OFFER_EXPIRATION_ENABLED:-true}
      OFFER_EXPIRATION_INTERVAL: ${OFFER_EXPIRATION_INTERVAL:-1h}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
      GEOCODING_USER_AGENT: "${GEOCODING_USER_AGENT:-Ofertando/1.0 (+https://ofertando.co)}"
      GEOCODING_COUNTRY_CODES: ${GEOCODING_COUNTRY_CODES:-co}
      GEOCODING_LIMIT: ${GEOCODING_LIMIT:-5}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS:-5000}
      GEOCODING_THROTTLE_MS: ${GEOCODING_THROTTLE_MS:-1000}
      GEOCODING_CACHE_TTL_MS: ${GEOCODING_CACHE_TTL_MS:-300000}
      REPUTATION_OFFER_UPVOTE: ${REPUTATION_OFFER_UPVOTE:-2}
      REPUTATION_COMMENT_UPVOTE: ${REPUTATION_COMMENT_UPVOTE:-1}
      REPUTATION_REPORT_RESOLVED: ${REPUTATION_REPORT_RESOLVED:-3}
      REPUTATION_REPORT_DISMISSED: ${REPUTATION_REPORT_DISMISSED:--1}
      REPUTATION_OFFER_DISABLED: ${REPUTATION_OFFER_DISABLED:--5}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - .:/app:Z
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-ofertando-network

  db:
    image: postgres:18-alpine
    container_name: back-ofertando-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ofertando}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ofertando}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back-ofertando-network

networks:
  back-ofertando-network:
    driver: bridge

volumes:
  db-data:
